name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build APK with Gradle
        run: |
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1))
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ -f ./gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
